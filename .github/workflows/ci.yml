# Required CI: offline only. No service containers, no secrets, no network beyond `npm ci` (registry.npmjs.org).
# `npm run ci` is the same single command contributors run locally: `npm test` (build + offline tests on memory,
# SQLite and the practice fake Redis; the real-Redis file reports skipped) and then the demo.
# Runner, Node and both official actions are pinned (actions by full commit SHA, tag in the trailing comment).
# The real Redis suite is optional: run `npm run test:redis` locally against your own Redis or trigger the
# manual `redis-real` workflow. Node 24/26 and `npm run check:pack` are checked locally before a release.
# test/workflow.test.ts checks these rules as part of `npm test`.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm run ci (Node 22.23.5, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
