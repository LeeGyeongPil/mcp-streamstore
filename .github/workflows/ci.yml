# Offline tests (memory, SQLite, practice fake Redis) on every supported Node line, a real Redis 7 job
# and an install check of the npm pack tarball.
# Kept deliberately small: only actions/checkout and actions/setup-node, no dependency cache, no
# continue-on-error jobs (every job here must be green). The early-warning run against the newest SDK
# releases lives in sdk-latest.yml so it can never turn a push red.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]   # engines: node >= 22.13 (node:sqlite without a flag)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run demo -- --backend all --lang en
      - name: Diagnostics on failure
        if: failure()
        run: |
          npm ls --depth=0 || true
          ls -la build/test-out/test dist || true

  redis:
    name: real Redis 7 (npm run test:redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379   # IPv4 literal: no localhost -> ::1 lookup on the runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run test:redis
      - run: npm run demo -- --backend redis --lang en
      - name: Diagnostics on failure
        if: failure()
        run: |
          npm ls --depth=0 || true
          docker ps -a || true

  pack:
    name: install check (npm run check:pack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run check:pack
