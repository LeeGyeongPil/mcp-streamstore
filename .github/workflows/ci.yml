# One job on one runner: offline tests (memory, SQLite, practice fake Redis), then the demo, then the real Redis 7
# suite against a service container.
# Kept as small as possible on purpose: Node 22 (the oldest supported line, engines >= 22.13),
# only actions/checkout and actions/setup-node, no dependency cache, no matrix, no scheduled runs.
# Node 24/26 and the npm pack install check (npm run check:pack) are run locally before a release.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test + real Redis 7 (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      # Offline suite: REDIS_URL is not set here, so the real Redis file reports one skipped test.
      - run: npm test
      - run: npm run demo -- --backend all --lang en
      # Real Redis suite: the IPv4 literal avoids a localhost -> ::1 lookup on the runner.
      - run: npm run test:redis
        env:
          REDIS_URL: redis://127.0.0.1:6379
